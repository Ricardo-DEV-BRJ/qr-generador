# Servidor estático para la SPA. Dokploy (Traefik) termina HTTPS delante de este
# contenedor, así que aquí solo escuchamos HTTP en el puerto 80.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    # ---------- Compresión ----------
    # 1) Archivos pre-comprimidos en el build (.br y .gz): cero CPU por petición.
    brotli_static on;
    gzip_static on;
    # 2) Respaldo dinámico para lo que no venga pre-comprimido (p. ej. sw.js).
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Healthcheck para Docker / Dokploy.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre (JS/CSS de Vite): caché de 1 año, inmutables.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker y su registro: siempre revalidar para recibir actualizaciones.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[\w-]+\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Íconos y demás estáticos sin hash: 7 días.
    location ~* \.(?:png|svg|ico|webp|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html (sin caché para publicar al instante).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
